name: Daily public feed
on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 1 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'bitfeed/**', '.github/workflows/daily-pages.yml', 'pyproject.toml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install .
      - name: Verify pipeline
        run: python -m unittest discover -s tests -v
      - name: Build from public VPS export
        env:
          BITFEED_SOURCE_URL: ${{ vars.BITFEED_SOURCE_URL }}
        run: |
          if [ -z "$BITFEED_SOURCE_URL" ]; then
            echo 'Set repository variable BITFEED_SOURCE_URL to the public site-data.json URL.'
            exit 1
          fi
          python -m bitfeed build-site --source "$BITFEED_SOURCE_URL" --output dist
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
