name: Manual public-source discovery
# 保留并行开发的公开来源查漏工具；生产定时采集统一在 VPS。
# 搜狗搜索只用于发现候选，不等于完整公众号订阅。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install '.[discovery]'
      - name: 采集站点与公众号搜索
        run: python collect_site_feed.py
      - name: 生成当日站点速览
        run: |
          python - <<'EOF'
          import json, datetime
          d = json.load(open('site-data/site-feed.json', encoding='utf-8'))
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()
          items = [a for a in d['articles'] if a.get('date') == today]
          lines = [f'# 站点速览 · {today}', '', f'共 {len(items)} 条（官网{sum(1 for i in items if i["kind"]=="site")}/公众号搜索{sum(1 for i in items if i["kind"]=="mp-search")}）', '']
          for a in items[:200]:
              lines.append(f"- {a['date']} [{a['group']}] {a['title']} → {a['url']}")
          open('site-data/today.md', 'w', encoding='utf-8').write('\n'.join(lines))
          EOF
      - name: 保存原始发现记录（不直接发布为订阅内容）
        uses: actions/upload-artifact@v4
        with:
          name: public-source-discovery
          path: site-data

