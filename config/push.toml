# =====================================================================
# 学术先锋号 · 群机器人推送设置
# 修改方法：在 GitHub 网页打开本文件 -> 点右上角铅笔图标 ✏️ -> 改完点右上角绿色 Commit changes
# 修改后服务器与 GitHub 会自动同步生效，无需登录服务器或敲命令！
# =====================================================================

# 1. 是否开启自动定时推送（true = 开启；寒暑假暂停推送请改成 false）
enabled = true

# 2. 推送间隔周数（2 = 每双周推一次；如果想改成每周推一次就填 1）
every_n_weeks = 2

# 3. 星期几推送（填数字 1~7：1=周一, 2=周二, 3=周三, 4=周四, 5=周五, 6=周六, 7=周日）
push_weekday = 2

# 4. 推送时间（北京时间 24 小时制，建议填整点或半点，例如 "09:00"、"12:00"、"20:00"）
push_time = "09:00"

# 5. 双周起算基准日（填第一个推送周所在日期，格式 "YYYY-MM-DD"）
#    系统会从这一周开始，每隔 every_n_weeks 周自动推送一次（例如 11-24 推、12-01 跳过、12-08 推）
anchor_date = "2026-11-24"

# 6. 活动统计范围：
#    start_weekday = 5 表示从「本周五」开始统计（1=周一 ... 5=周五 ... 7=周日）
#    span_days = 15 表示连续统计 15 天（即「本周五」到「下下个周五」，含首尾两个周五）
start_weekday = 5
span_days = 15

# 7. 飞书卡片与 Word 文档标题前缀（不要超过 40 个字）
title_prefix = "北理双周活动汇总（学术先锋号）"
