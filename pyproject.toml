[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-student-feed"
version = "0.2.0"
description = "Campus news collection, evidence-bounded AI ranking, RSS and daily guidance"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
collector = ["psutil>=6,<8", "zstandard>=0.23,<1", "pycryptodome>=3.20,<4", "paramiko>=3.5,<5"]

[project.scripts]
bitfeed = "bitfeed.__main__:main"

[tool.setuptools.packages.find]
include = ["bitfeed*"]

[tool.setuptools.package-data]
bitfeed = ["web/*"]
